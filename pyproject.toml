[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "length-budget-distill"
version = "0.1.0"
description = "Controlled trace-length and student-teaching-utility experiments"
requires-python = ">=3.10"
dependencies = [
  "datasets>=3.2",
  "matplotlib>=3.10",
  "numpy>=1.26",
  "peft>=0.12",
  "safetensors>=0.7",
  "scipy>=1.15",
  "torch>=2.4",
  "transformers>=4.48,<5",
]

[project.optional-dependencies]
generation = ["vllm>=0.6.3"]
dev = ["ruff>=0.15"]

[tool.setuptools.packages.find]
where = ["src"]
